[project]
name = "sift-api"
version = "1.0.0"
description = "FastAPI backend for Sift: CSV ingestion, LLM enrichment with schema validation, and evals"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.34",
    "anthropic==2.12.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.6"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are the intended pattern

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
